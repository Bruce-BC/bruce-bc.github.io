# Profile
about_title: Profile
about_profile_image: images/profile.jpg
about_content: |
  I am a bioinformatician and team lead with **6+ years of industry experience** connecting microbial and phage genomics, metagenomics, pipeline engineering, analysis operations, and scientific communication.

  My work spans WGS, hybrid assembly, 16S/ITS and shotgun metagenomics, comparative-genomics marker discovery, and reproducible workflow development. I focus on turning complex sequencing data into maintainable analysis systems and decisions that researchers can act on.

content:
  - title: Career Snapshot
    layout: text
    content: |
      - Lead analysis operations, quality review, scientific support, and onboarding for a **five-person bioinformatics team**.
      - Integrated **16S, ITS, Hybrid, and WGS** analyses behind a shared Snakemake entry point and containerized environments.
      - Supported at least **98 distinct analysis order codes** found in archived project communications; this is a conservative lower bound, not a claim of total workload.
      - Co-authored **seven SCI(E) papers** and contributed to **one patent** for an NGS-based foodborne-pathogen detection method.

      [Download resume (PDF)](https://bruce-bc.github.io/assets/documents/Byungcheol_Kang_Bioinformatics_Resume.pdf) · [Download project portfolio (PDF)](https://bruce-bc.github.io/assets/documents/Byungcheol_Kang_Bioinformatics_Portfolio.pdf)

  - title: Professional Experience
    layout: list
    content:
      - layout: left
        border: weak
        title: Sanigen Inc.
        sub_title: Bioinformatics Team Lead / Senior Researcher
        caption: Mar 2020 – Present
        link: https://sanigen.kr
        link_text: sanigen.kr
        description: |
          - Design and operate WGS, hybrid assembly, 16S/ITS amplicon, and shotgun-metagenome analysis services; oversee result review and scientific support.
          - Analyze bacterial, bacteriophage, viral, fungal, and organelle genomes using de novo, hybrid, and reference-assisted assembly, annotation, and comparative genomics.
          - Modularized the analysis platform with Snakemake and standardized runtime environments with Conda, Docker, and Singularity/Apptainer.
          - Automated QC, taxonomic profiling, diversity analysis, AMR/virulence/mobile-element searches, visualization, and HTML report generation with Python, R, and Bash.
          - Translate research questions into analysis plans and communicate methods, limitations, and reanalysis decisions across laboratory, commercial, and research teams.
          - Maintain Linux/HPC analysis infrastructure, NAS storage, Git-based source control, operating guides, and onboarding materials.

      - layout: left
        border: weak
        title: GinaPath
        sub_title: Business Development
        caption: Nov 2019 – Jan 2020
        description: |
          - Supported quotations, schedules, study materials, reports, and partner communication for domestic and international preclinical and clinical projects.

  - title: Selected Projects
    layout: list
    content:
      - layout: top-middle
        border: weak
        title: Integrated Microbial Genomics and Metagenomics Platform
        quote: Reproducible workflows from raw reads to quality-reviewed reports.
        description: |
          Consolidated fragmented 16S, ITS, Hybrid, and WGS assets into a shared Snakemake architecture. Modularized QC, database checks, assembly, annotation, statistics, visualization, HTML reporting, and delivery while separating server-specific profiles and container environments.

          `Snakemake` `Python` `R` `Bash` `QIIME2` `DADA2` `Conda` `Apptainer` `Docker` `Git`
        additional_links:
          - title: Pipeline repository
            icon: fab fa-github
            url: https://github.com/Bruce-BC/Bioinformatics_pipeline

      - layout: top-middle
        border: weak
        title: Comparative-Genomics Marker Discovery
        quote: Candidate regions for strain- and species-specific detection.
        description: |
          Built filtered reference sets from public complete genomes and combined whole-genome comparison with k-mer searches to narrow target/non-target marker candidates. In one project, delivered an approximately 17 kb candidate region with FASTA and visualization outputs, while separating computational evidence from required wet-lab validation.

          `Comparative genomics` `k-mer analysis` `NCBI RefSeq/GenBank` `Python` `R`

      - layout: top-middle
        border: weak
        title: Phage Genome Assembly and Annotation
        quote: Resolving fragmented assemblies and improving biological interpretation.
        description: |
          Applied parameter tuning and reference-assisted assembly to fragmented phage datasets and obtained a final one-contig result across the assessed samples. Supplemented hypothetical-protein-heavy Prokka output with RAST-tk and supported interpretation of circularity, depth, annotation, and prophage coordinates. Also evaluated an Oxford Nanopore bacterial Nextflow workflow for internal adoption.

          `Illumina` `Oxford Nanopore` `Unicycler` `Prokka` `RAST-tk` `Nextflow/EPI2ME`

      - layout: top-middle
        border: weak
        title: Foodborne-Pathogen NGS Detection Panel
        quote: Comparative-genomics evidence translated into a multiplex detection workflow.
        description: |
          Contributed marker discovery, analysis-pipeline development, and a web interface for an NGS panel designed to detect multiple foodborne pathogens. The work led to two peer-reviewed papers in 2023 and a joint patent in 2022.

          `Marker discovery` `NGS panel` `Pipeline development` `Web interface`

      - layout: top-middle
        border: weak
        title: Lytic/Lysogenic Phage Classification Prototype
        quote: Independent research prototype — external benchmarking pending.
        description: |
          Designed an explainable end-to-end classifier that combines genome quality, lysogeny markers, and independent lifestyle predictions from CheckV, Pharokka/Phold, BACPHLIP, and PhaTYP. Conflicting evidence remains explicitly flagged for review. The next step is evaluation on a curated lifestyle dataset with sensitivity, specificity, MCC, calibration, baseline comparisons, and ablation studies.

          `CheckV` `Pharokka` `Phold` `BACPHLIP` `PhaTYP` `Evidence integration`

