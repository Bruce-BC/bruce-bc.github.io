<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Mobile shotgun taxonomy flow and selected-taxon summary</title>
  <desc id="desc">A vertically arranged taxonomy flow from domain to genus followed by selected-genus count and percentage charts.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#fbfcfd;stroke:#d8dee4;stroke-width:2}.ink{fill:#24292f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#57606a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.axis{stroke:#57606a;stroke-width:1.5}.grid{stroke:#d8dee4;stroke-width:1}.node{stroke:#fff}.flow{fill:none;stroke-linecap:round;opacity:.32}.chip{fill:#ddf4ff;stroke:#54aeff}.selected{fill:#dafbe1;stroke:#2da44e}.bar-a{fill:#1f9d8a}.bar-b{fill:#f9844a}
    </style>
  </defs>
  <rect class="bg" width="600" height="1100"/>
  <text class="ink" x="28" y="40" font-size="24" font-weight="700">Shotgun classification</text>
  <text class="muted" x="28" y="66" font-size="13">Kraken2/Pavian-style output reconstruction</text>
  <rect class="chip" x="412" y="24" width="160" height="30" rx="15"/><text class="ink" x="492" y="44" text-anchor="middle" font-size="10" font-weight="700">ILLUSTRATIVE</text>
  <rect class="panel" x="20" y="88" width="560" height="596" rx="12"/>
  <text class="ink" x="44" y="124" font-size="19" font-weight="700">Taxonomic flow</text>
  <text class="muted" x="44" y="147" font-size="12">Classified reads retained through each rank.</text>
  <g class="muted" font-size="10" font-weight="700" text-anchor="middle"><text x="65" y="183">DOMAIN</text><text x="182" y="183">PHYLUM</text><text x="299" y="183">CLASS</text><text x="416" y="183">ORDER</text><text x="530" y="183">GENUS</text></g>
  <g>
    <path class="flow" stroke="#9b5de5" stroke-width="100" d="M66 280 C112 280 132 280 178 280"/><path class="flow" stroke="#277da1" stroke-width="62" d="M186 254 C230 254 250 244 295 244"/><path class="flow" stroke="#43aa8b" stroke-width="26" d="M186 326 C230 326 250 322 295 322"/><path class="flow" stroke="#f9c74f" stroke-width="12" d="M186 352 C230 352 250 371 295 371"/>
    <path class="flow" stroke="#277da1" stroke-width="43" d="M303 234 C348 234 367 226 412 226"/><path class="flow" stroke="#90be6d" stroke-width="19" d="M303 270 C348 270 367 278 412 278"/><path class="flow" stroke="#43aa8b" stroke-width="21" d="M303 316 C348 316 367 326 412 326"/><path class="flow" stroke="#f9844a" stroke-width="10" d="M303 351 C348 351 367 368 412 368"/><path class="flow" stroke="#f9c74f" stroke-width="12" d="M303 389 C348 389 367 404 412 404"/>
    <path class="flow" stroke="#277da1" stroke-width="28" d="M420 218 C463 218 480 215 519 215"/><path class="flow" stroke="#54aeff" stroke-width="15" d="M420 244 C463 244 480 254 519 254"/><path class="flow" stroke="#90be6d" stroke-width="19" d="M420 278 C463 278 480 294 519 294"/><path class="flow" stroke="#43aa8b" stroke-width="21" d="M420 326 C463 326 480 337 519 337"/><path class="flow" stroke="#f9844a" stroke-width="10" d="M420 368 C463 368 480 378 519 378"/><path class="flow" stroke="#f9c74f" stroke-width="12" d="M420 404 C463 404 480 416 519 416"/>
  </g>
  <g class="node"><rect x="55" y="230" width="22" height="100" rx="4" fill="#9b5de5"/><rect x="174" y="223" width="22" height="62" rx="4" fill="#277da1"/><rect x="174" y="313" width="22" height="26" rx="4" fill="#43aa8b"/><rect x="174" y="346" width="22" height="12" rx="4" fill="#f9c74f"/><rect x="291" y="212" width="22" height="43" rx="4" fill="#277da1"/><rect x="291" y="261" width="22" height="19" rx="4" fill="#90be6d"/><rect x="291" y="305" width="22" height="21" rx="4" fill="#43aa8b"/><rect x="291" y="346" width="22" height="10" rx="4" fill="#f9844a"/><rect x="291" y="383" width="22" height="12" rx="4" fill="#f9c74f"/><rect x="408" y="204" width="22" height="28" rx="4" fill="#277da1"/><rect x="408" y="237" width="22" height="15" rx="4" fill="#54aeff"/><rect x="408" y="269" width="22" height="19" rx="4" fill="#90be6d"/><rect x="408" y="315" width="22" height="21" rx="4" fill="#43aa8b"/><rect x="408" y="363" width="22" height="10" rx="4" fill="#f9844a"/><rect x="408" y="398" width="22" height="12" rx="4" fill="#f9c74f"/><rect x="517" y="201" width="22" height="28" rx="4" fill="#277da1"/><rect x="517" y="247" width="22" height="15" rx="4" fill="#54aeff"/><rect x="517" y="285" width="22" height="19" rx="4" fill="#90be6d"/><rect x="517" y="326" width="22" height="21" rx="4" fill="#43aa8b"/><rect x="517" y="373" width="22" height="10" rx="4" fill="#f9844a"/><rect x="517" y="410" width="22" height="12" rx="4" fill="#f9c74f"/></g>
  <g class="ink" font-size="9"><text x="48" y="350">Bacteria</text><text x="153" y="299">Proteobacteria</text><text x="165" y="343">Firmicutes</text><text x="272" y="207">Gamma-</text><text x="272" y="218">proteobacteria</text><text x="390" y="198">Enterobacterales</text><text x="493" y="194" font-weight="700">Escherichia</text><text x="490" y="244">Pseudomonas</text><text x="489" y="282">Lactobacillus</text><text x="490" y="323">Clostridium</text><text x="494" y="370">Bacillus</text></g>
  <rect class="selected" x="508" y="191" width="41" height="47" rx="6" fill-opacity=".16"/>
  <g transform="translate(45 475)"><rect width="510" height="170" rx="9" fill="#f6f8fa" stroke="#d8dee4"/><text class="ink" x="18" y="28" font-size="13" font-weight="700">How to read this view</text><text class="muted" x="18" y="55" font-size="12">1 · Compare classified and unclassified fractions.</text><text class="muted" x="18" y="79" font-size="12">2 · Follow wide lineages across taxonomic ranks.</text><text class="muted" x="18" y="103" font-size="12">3 · Select a taxon for sample-level counts.</text><rect class="bar-a" x="18" y="127" width="280" height="15" rx="7"/><rect fill="#c9d1d9" x="298" y="127" width="164" height="15" rx="7"/><text class="muted" x="18" y="160" font-size="10">classified 51–80%</text><text class="muted" x="347" y="160" font-size="10">unclassified</text></g>
  <rect class="panel" x="20" y="704" width="560" height="330" rx="12"/>
  <text class="ink" x="44" y="741" font-size="19" font-weight="700">Selected taxon · <tspan font-style="italic">Escherichia</tspan></text>
  <text class="muted" x="44" y="764" font-size="12">Genus-level illustrative summary</text>
  <text class="ink" x="48" y="801" font-size="12" font-weight="700">Assigned reads</text><text class="ink" x="328" y="801" font-size="12" font-weight="700">Percent classified</text>
  <g transform="translate(48 818)"><line class="axis" x1="0" y1="145" x2="220" y2="145"/><line class="grid" x1="0" y1="85" x2="220" y2="85"/><g class="bar-a"><rect x="8" y="27" width="24" height="118"/><rect x="44" y="58" width="24" height="87"/><rect x="80" y="18" width="24" height="127"/><rect x="116" y="92" width="24" height="53"/><rect x="152" y="68" width="24" height="77"/><rect x="188" y="42" width="24" height="103"/></g><g class="muted" font-size="9" text-anchor="middle"><text x="20" y="160">S1</text><text x="56" y="160">S2</text><text x="92" y="160">S3</text><text x="128" y="160">S4</text><text x="164" y="160">S5</text><text x="200" y="160">S6</text></g></g>
  <g transform="translate(328 818)"><line class="axis" x1="0" y1="145" x2="220" y2="145"/><line class="grid" x1="0" y1="85" x2="220" y2="85"/><g class="bar-b"><rect x="8" y="35" width="24" height="110"/><rect x="44" y="82" width="24" height="63"/><rect x="80" y="24" width="24" height="121"/><rect x="116" y="95" width="24" height="50"/><rect x="152" y="67" width="24" height="78"/><rect x="188" y="48" width="24" height="97"/></g><g class="muted" font-size="9" text-anchor="middle"><text x="20" y="160">S1</text><text x="56" y="160">S2</text><text x="92" y="160">S3</text><text x="128" y="160">S4</text><text x="164" y="160">S5</text><text x="200" y="160">S6</text></g></g>
  <text class="muted" x="28" y="1070" font-size="12">Format reconstruction · not a client measurement.</text>
</svg>
