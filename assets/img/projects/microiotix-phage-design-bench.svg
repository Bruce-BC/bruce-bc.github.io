<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 700" role="img" aria-labelledby="title desc">
  <title id="title">Phage tail-module design bench</title>
  <desc id="desc">A computational design view connecting an anonymized lytic phage chassis, two receptor-binding protein slots, a K64 capsule target, and evidence-based design gates.</desc>
  <defs>
    <style>
      .bg{fill:#0e120f}.panel{fill:#161b17;stroke:#2b352e;stroke-width:2}.inner{fill:#10140f;stroke:#28302a;stroke-width:2}
      .ink{fill:#e7ebe5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#98a499;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{fill:#98a499;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}.accent{fill:#68d8b6}.line{stroke:#68d8b6;stroke-width:10;stroke-linecap:round;fill:none}.off{stroke:#88938c;stroke-width:10;stroke-linecap:round;fill:none}
      .capsule{fill:#b8c866;stroke:#d9e58e;stroke-width:2}.ok{fill:#17372d;stroke:#68d8b6;stroke-width:2}.warn{fill:#3b211d;stroke:#e58175;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="mono" x="44" y="42" font-size="15" letter-spacing="3">PHAGE ENGINEERING BENCH · SANITIZED VIEW</text>
  <text class="ink" x="44" y="79" font-size="27" font-weight="700">Capsule-targeted tail-module design</text>
  <text class="muted" x="44" y="108" font-size="16">Phage chassis, tail-protein slots and capsule-target interaction.</text>

  <rect class="panel" x="42" y="142" width="770" height="505" rx="16"/>
  <text class="muted" x="66" y="176" font-size="15" font-weight="700">ASSEMBLY &amp; INFECTION MODEL</text>
  <rect class="inner" x="66" y="195" width="722" height="332" rx="12"/>

