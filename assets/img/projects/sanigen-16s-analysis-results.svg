<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">16S diversity analysis results</title>
  <desc id="desc">Two-panel figure showing Shannon rarefaction curves and weighted UniFrac principal coordinates for nine anonymized samples.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#fbfcfd;stroke:#d8dee4;stroke-width:2}.ink{fill:#24292f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#57606a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.axis{stroke:#57606a;stroke-width:2}.grid{stroke:#d8dee4;stroke-width:1}.curve{fill:none;stroke-width:3}.pt{stroke:#fff;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="ink" x="48" y="48" font-size="28" font-weight="700">16S amplicon analysis · nine-sample report</text>
  <text class="muted" x="48" y="77" font-size="16">Original QIIME 2 outputs re-rendered with anonymized labels; no biological group inference is claimed.</text>
  <rect class="panel" x="42" y="105" width="545" height="465" rx="12"/>
  <rect class="panel" x="613" y="105" width="545" height="465" rx="12"/>
  <text class="ink" x="70" y="144" font-size="20" font-weight="700">A · Shannon rarefaction</text>
  <text class="muted" x="70" y="169" font-size="14">Within-sample diversity stabilizes across sequencing depth.</text>
  <g transform="translate(102 195)">
    <line class="grid" x1="0" y1="0" x2="435" y2="0"/><line class="grid" x1="0" y1="75" x2="435" y2="75"/><line class="grid" x1="0" y1="150" x2="435" y2="150"/><line class="grid" x1="0" y1="225" x2="435" y2="225"/><line class="grid" x1="0" y1="300" x2="435" y2="300"/>
    <line class="axis" x1="0" y1="300" x2="435" y2="300"/><line class="axis" x1="0" y1="0" x2="0" y2="300"/>
    <path class="curve" stroke="#0969da" d="M0 300L44 107L87 107L131 107L174 107"/><path class="curve" stroke="#1a7f37" d="M0 300L44 113L87 113L131 113L174 113L218 113"/>
    <path class="curve" stroke="#8250df" d="M0 300L44 134L87 134L131 134"/><path class="curve" stroke="#bf8700" d="M0 300L44 131L87 131L131 131L174 131"/>
    <path class="curve" stroke="#cf222e" d="M0 300L44 118L87 119L131 118L174 118L218 118L261 118L305 118L348 118"/><path class="curve" stroke="#0550ae" d="M0 300L44 131L87 131L131 131L174 131"/>
    <path class="curve" stroke="#116329" d="M0 300L44 53L87 53L131 53L174 53L218 53L261 53"/><path class="curve" stroke="#6639ba" d="M0 300L44 1L87 1L131 1L174 1L218 1L261 1L305 1L348 1L392 1L435 1"/><path class="curve" stroke="#9a6700" d="M0 300L44 15L87 15L131 15L174 14L218 14L261 14L305 14L348 14L392 14"/>
    <text class="muted" x="218" y="348" text-anchor="middle" font-size="14">Subsampled sequence depth</text><text class="muted" x="-155" y="-54" transform="rotate(-90)" text-anchor="middle" font-size="14">Shannon diversity</text>
    <text class="muted" x="0" y="322" text-anchor="middle" font-size="12">0</text><text class="muted" x="218" y="322" text-anchor="middle" font-size="12">mid</text><text class="muted" x="435" y="322" text-anchor="middle" font-size="12">max</text>
  </g>

  <text class="ink" x="641" y="144" font-size="20" font-weight="700">B · Weighted UniFrac PCoA</text>
  <text class="muted" x="641" y="169" font-size="14">Abundance-weighted community distances; labels are anonymized.</text>
  <g transform="translate(686 195)">
    <line class="grid" x1="0" y1="0" x2="420" y2="0"/><line class="grid" x1="0" y1="75" x2="420" y2="75"/><line class="grid" x1="0" y1="150" x2="420" y2="150"/><line class="grid" x1="0" y1="225" x2="420" y2="225"/><line class="grid" x1="0" y1="300" x2="420" y2="300"/>
    <line class="grid" x1="0" y1="0" x2="0" y2="300"/><line class="grid" x1="105" y1="0" x2="105" y2="300"/><line class="grid" x1="210" y1="0" x2="210" y2="300"/><line class="grid" x1="315" y1="0" x2="315" y2="300"/><line class="grid" x1="420" y1="0" x2="420" y2="300"/>
    <line class="axis" x1="0" y1="300" x2="420" y2="300"/><line class="axis" x1="0" y1="0" x2="0" y2="300"/>
    <circle class="pt" cx="79" cy="158" r="9" fill="#0969da"/><circle class="pt" cx="51" cy="182" r="9" fill="#1a7f37"/><circle class="pt" cx="51" cy="192" r="9" fill="#8250df"/>
    <circle class="pt" cx="20" cy="267" r="9" fill="#bf8700"/><circle class="pt" cx="35" cy="194" r="9" fill="#cf222e"/><circle class="pt" cx="41" cy="188" r="9" fill="#0550ae"/>
    <circle class="pt" cx="101" cy="24" r="9" fill="#116329"/><circle class="pt" cx="300" cy="130" r="9" fill="#6639ba"/><circle class="pt" cx="394" cy="241" r="9" fill="#9a6700"/>
    <g class="muted" font-size="12"><text x="66" y="146">S1</text><text x="38" y="170">S2</text><text x="38" y="214">S3</text><text x="8" y="289">S4</text><text x="22" y="216">S5</text><text x="28" y="176">S6</text><text x="88" y="13">S7</text><text x="287" y="118">S8</text><text x="381" y="263">S9</text></g>
    <text class="muted" x="210" y="348" text-anchor="middle" font-size="14">PC1 · 78.01%</text><text class="muted" x="-150" y="-54" transform="rotate(-90)" text-anchor="middle" font-size="14">PC2 · 10.58%</text>
  </g>
  <text class="muted" x="48" y="602" font-size="13">Source: versioned nine-sample 16S report. PCoA percentages are retained from the original weighted UniFrac output.</text>
</svg>
