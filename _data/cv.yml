    Experience:
      - company: Microiotix
        position: Bioinformatician
        start_date: 2026-07
        end_date: present
        summary: Analyze bacterial and bacteriophage genomes and develop evidence-driven resources for phage target selection and in silico design.
        highlights:
          - Analyze bacterial genomes for host context and phage genomes for quality, annotation, taxonomy, lifestyle, packaging, and tail-gene interpretation.
          - Built and evaluated a Klebsiella pneumoniae tail/RBP and KL-type reference database with 7,759 curated sequences, source traceability, confidence labels, and experimentally verified targets explicitly flagged.
          - Applied sequence- and structure-based protein analysis with Phold, ProstT5, Foldseek, and experimental PDB references to identify divergent tail proteins and assess engineered RBP designs.
          - Integrated CheckV, Pharokka, Phold, BACPHLIP, PhaTYP, PhaGCN, and PhageTerm evidence in an anonymized four-genome case study; the tools independently converged on lytic Przondovirus genomes with short DTR packaging.
          - Developed an in silico tail-RBP design workflow that evaluates anchor compatibility, KL-target evidence, taxonomic context, cluster-label conflicts, and structural retention before producing genome and protein design files.

      - company: Sanigen
        position: Bioinformatics Team Lead · Senior Researcher
        location: Suwon, South Korea
        start_date: 2020-03
        end_date: 2025-10
        summary: Led a five-person bioinformatics team delivering microbial genomics and metagenomics analyses.
        highlights:
          - Designed and maintained a shared Snakemake platform covering 16S, ITS, WGS, and hybrid-assembly workflows.
          - Delivered microbial WGS, assembly, annotation, comparative genomics, and microbiome analyses with explicit quality-control checkpoints.
          - Maintained reproducible environments with Conda, Docker, Apptainer, and Linux-based compute infrastructure.
          - Developed in-house analysis utilities for NGS panel markers, microbial assemblies, and comparative-genomics investigations.
          - Coordinated analysis operations, review, interpretation, and delivery across a conservative lower bound of 98 archived project orders.

