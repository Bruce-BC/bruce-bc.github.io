    Projects:
      - name: Klebsiella Phage Reference Database & In Silico Design
        summary: Built a tail/RBP and KL-type reference database to connect protein sequences with capsule-target evidence.
        highlights:
          - Integrated anchor compatibility, reference-label consistency, and protein-structure evidence to prioritize in silico tail-RBP design candidates for experimental follow-up.

      - name: CRC Atlas Annotation & Normal-Tissue Expression Analysis
        summary: Integrated CRC datasets across studies, annotated cell types, and reviewed annotation consistency and tumor/normal labels.
        highlights:
          - Compared externally supplied normal-tissue atlas expression and analyzed CRC markers after expression-based off-target filtering.

      - name: Sanigen Integrated Microbial Genomics Platform
        summary: Designed and maintained a shared Snakemake platform for 16S, ITS, WGS, and Illumina-ONT hybrid assembly.
        highlights:
          - Standardized inputs, execution environments, QC checkpoints, logs, and report packaging to support reproducible analysis and review.

      - name: Comparative Genomics-Based Marker Discovery
        summary: Compared complete microbial genomes to identify candidate marker regions and assess their specificity, conservation, and suitability for downstream assays.
        highlights:
          - Prioritized an approximately 17 kb region for experimental follow-up.

