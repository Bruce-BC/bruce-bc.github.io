    Projects:
      - name: Integrated Microbial Genomics Platform
        summary: A shared Snakemake execution and reporting framework for 16S, ITS, WGS, and hybrid-assembly analyses.
        highlights:
          - Standardized validation, environment capture, checkpoints, and deliverables across assay profiles.
          - Implemented with Python, R, Bash, Conda, Docker, and Apptainer.

      - name: Comparative-genomics Marker Discovery
        summary: Prioritized a candidate region of approximately 17 kb by comparing complete microbial genomes.
        highlights:
          - Combined pan-genome context, region-level comparison, and downstream assay constraints.

      - name: Bacteriophage Assembly and Annotation
        summary: Evaluated assembly and annotation strategies for bacteriophage sequencing data.
        highlights:
          - Produced single-contig final assemblies in the assessed sample set.
          - Supplemented Prokka annotations with RAST-tk and evaluated ONT/Nextflow-based processing.

      - name: Phage Lifestyle Evidence Prototype
        summary: Independent prototype integrating CheckV, Pharokka/Phold, BACPHLIP, and PhaTYP evidence.
        highlights:
          - Designed to keep tool disagreement visible rather than collapse every signal into an unexplained label.
          - External benchmarking and publication-grade validation remain pending.

