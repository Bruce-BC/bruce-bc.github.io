comparative-genomics-marker-discovery:
  workflows:
    marker_discovery_workflow:
      title: Marker discovery workflow
      display_only_nodes:
        - curated_complete_genomes
        - candidate_intervals
        - candidate_region
      nodes:
        consistency_checks:
          label: Assembly and annotation consistency checks
          entries:
            - name: Assembly and annotation consistency checks
              kind: review
              role: Confirm that complete genomes can be compared on a like-for-like basis
              input: Curated complete genomes
              output: Comparison-ready genome set
              usage_status: used
              pipeline_state: documented-only
        whole_genome_comparison:
          label: Whole-genome comparison
          entries:
            - name: Whole-genome comparison
              kind: method
              role: Identify large-scale genomic differences across the complete genomes
              input: Comparison-ready genome set
              output: Genome-wide difference candidates
              usage_status: used
              pipeline_state: documented-only
        pangenome_region_context:
          label: Pan-genome and region context
          entries:
            - name: Pan-genome and region context
              kind: method
              role: Place candidate differences into broader region and conservation context
              input: Genome-wide difference candidates
              output: Contextualized candidate intervals
              usage_status: used
              pipeline_state: documented-only
        specificity_conservation_review:
          label: Specificity and conservation review
          entries:
            - name: Specificity and conservation review
              kind: review
              role: Filter candidates against specificity and conservation constraints
              input: Contextualized candidate intervals
              output: Prioritized candidate region list
              usage_status: used
              pipeline_state: documented-only
        assay_constraints:
          label: Downstream assay constraints
          entries:
            - name: Downstream assay constraints
              kind: review
              role: Keep marker candidates practical for downstream assay development
              input: Prioritized candidate regions
              output: Follow-up-ready candidate region
              usage_status: used
              pipeline_state: documented-only

