analysis-operations-and-qa:
  workflows:
    operating_model:
      title: Operating model
      display_only_nodes:
        - request_question
      nodes:
        scope_review:
          label: Scope and metadata review
          entries:
            - name: Scope and metadata review
              kind: review
              role: Clarify the biological question, project scope, and required metadata before analysis starts
              input: Request details and project metadata
              output: Ready-to-run analysis scope
              usage_status: used
              pipeline_state: documented-only
        workflow_selection:
          label: Workflow selection
          entries:
            - name: Workflow selection
              kind: method
              role: Match the project question to the appropriate analysis profile
              input: Reviewed scope and metadata
              output: Selected execution path
              usage_status: used
              pipeline_state: documented-only
        execution_qc:
          label: Execution and QC
          entries:
            - name: Execution and QC
              kind: method
              role: Run the selected analysis and check technical quality before interpretation
              input: Selected workflow and project inputs
              output: QC-checked analysis outputs
              usage_status: used
              pipeline_state: documented-only
        review_gate:
          label: Review gate
          entries:
            - name: Review gate
              kind: review
              role: Decide whether results are ready for interpretation or need revision
              input: QC-checked outputs
              output: Accept or revise decision
              usage_status: used
              pipeline_state: documented-only
        interpretation:
          label: Interpretation
          entries:
            - name: Interpretation
              kind: review
              role: Translate technical outputs into biologically relevant conclusions
              input: Accepted analysis outputs
              output: Interpreted findings
              usage_status: used
              pipeline_state: documented-only
        report_package:
          label: Report and data package
          entries:
            - name: Report and data package
              kind: method
              role: Package reviewed outputs, interpretation, and retained provenance for delivery
              input: Interpreted findings and traceable analysis records
              output: Delivered report and data package
              usage_status: used
              pipeline_state: documented-only
        feedback_provenance:
          label: Feedback and retained provenance
          entries:
            - name: Feedback and retained provenance
              kind: method
              role: Preserve rerun context, clarification history, and traceable project records
              input: Delivered outputs and stakeholder feedback
              output: Retained provenance for follow-up work
              usage_status: used
              pipeline_state: documented-only
    archived_project_mix:
      title: Archived project mix
      display_only_nodes:
        - archived_mix
      nodes:
        wgs_projects:
          label: WGS
          entries:
            - name: WGS
              kind: method
              role: Archived whole-genome sequencing work represented in project communications
              input: Distinct order codes in archived communications
              output: Conservative lower-bound count of 28 order codes
              usage_status: used
              pipeline_state: documented-only
        hybrid_projects:
          label: Hybrid
          entries:
            - name: Hybrid
              kind: method
              role: Archived hybrid-assembly work represented in project communications
              input: Distinct order codes in archived communications
              output: Conservative lower-bound count of 21 order codes
              usage_status: used
              pipeline_state: documented-only
        amplicon_16s_projects:
          label: 16S
          entries:
            - name: 16S
              kind: method
              role: Archived 16S work represented in project communications
              input: Distinct order codes in archived communications
              output: Conservative lower-bound count of 19 order codes
              usage_status: used
              pipeline_state: documented-only
        shotgun_projects:
          label: Shotgun
          entries:
            - name: Shotgun
              kind: method
              role: Archived shotgun metagenomics work represented in project communications
              input: Distinct order codes in archived communications
              output: Conservative lower-bound count of 18 order codes
              usage_status: used
              pipeline_state: documented-only
        rna_projects:
          label: RNA
          entries:
            - name: RNA
              kind: method
              role: Archived RNA analysis work represented in project communications
              input: Distinct order codes in archived communications
              output: Conservative lower-bound count of 7 order codes
              usage_status: used
              pipeline_state: documented-only
        its_projects:
          label: ITS
          entries:
            - name: ITS
              kind: method
              role: Archived ITS work represented in project communications
              input: Distinct order codes in archived communications
              output: Conservative lower-bound count of 3 order codes
              usage_status: used
              pipeline_state: documented-only
        other_projects:
          label: Other
          entries:
            - name: Other
              kind: method
              role: Archived work outside the major listed profiles
              input: Distinct order codes in archived communications
              output: Conservative lower-bound count of 2 order codes
